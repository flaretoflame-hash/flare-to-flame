<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0805;font-family:'Outfit',sans-serif;min-height:100vh;padding:28px 14px 50px;display:flex;flex-direction:column;align-items:center;}
.header{text-align:center;margin-bottom:28px;}
.brand-tag{font-size:8px;letter-spacing:4px;color:#C9A84C;text-transform:uppercase;margin-bottom:6px;}
.brand-name{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#FAF7F2;letter-spacing:-0.5px;margin-bottom:4px;}
.brand-sub{font-family:'Playfair Display',serif;font-size:12px;font-style:italic;color:rgba(201,168,76,0.65);}
.tap-hint{margin-top:10px;font-size:9px;color:rgba(250,247,242,0.28);letter-spacing:1px;}
.cards{width:100%;max-width:680px;display:flex;flex-direction:column;gap:14px;}
.card{position:relative;width:100%;border-radius:20px;overflow:hidden;cursor:pointer;transition:all 0.45s cubic-bezier(0.16,1,0.3,1);min-height:130px;}
.card:hover{transform:translateY(-3px);}
.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center;}
.card-overlay{position:absolute;inset:0;pointer-events:none;}
.card-inner{position:relative;display:flex;flex-direction:row;align-items:stretch;min-height:130px;}
.card-spacer{width:40%;flex-shrink:0;}
.card-text{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 20px 52px 12px;gap:5px;}
.card-cat{font-size:8px;letter-spacing:2.5px;font-weight:700;text-transform:uppercase;}
.card-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-0.3px;}
.card-divider{width:36px;height:1px;opacity:0.5;margin:3px 0;}
.card-short{font-size:10px;line-height:1.6;}
.card-full{margin-top:8px;font-size:11px;line-height:1.72;border-top-width:1px;border-top-style:solid;padding-top:8px;display:none;}
.card-brand{margin-top:6px;display:inline-block;border-radius:4px;padding:2px 8px;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;border-width:0.5px;border-style:solid;display:none;}
.card-expand{position:absolute;bottom:10px;left:42%;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.4;}
.book-btn{position:absolute;bottom:12px;right:16px;background:linear-gradient(135deg,#d4af37,#b89326);color:#fff;padding:8px 16px;border-radius:9px;font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;text-decoration:none;box-shadow:0 4px 16px rgba(180,140,30,0.45);display:inline-flex;align-items:center;gap:5px;z-index:10;white-space:nowrap;}
.story-label{position:absolute;bottom:14px;left:14px;background:rgba(0,0,0,0.36);backdrop-filter:blur(8px);border-radius:6px;padding:3px 8px;font-family:'Playfair Display',serif;font-size:9px;font-style:italic;color:rgba(255,255,255,0.80);}
.footer{margin-top:28px;font-size:8px;letter-spacing:3px;color:rgba(201,168,76,0.28);text-transform:uppercase;text-align:center;}
</style>

function buildCards() {
  const container = document.getElementById('cards');
  CARDS.forEach((card, i) => {
    const isDark = card.dark;
    const textColor = isDark ? '#FAF7F2' : '#1a0a04';
    const subColor = isDark ? 'rgba(250,247,242,0.78)' : 'rgba(50,25,8,0.78)';
    const overlay = isDark
      ? 'linear-gradient(to right,transparent 35%,rgba(5,20,25,0.82) 55%,rgba(5,20,25,0.97) 100%)'
      : 'linear-gradient(to right,transparent 35%,rgba(250,248,244,0.82) 55%,rgba(248,245,240,0.97) 100%)';

    const el = document.createElement('div');
    el.className = 'card';
    el.style.boxShadow = `0 12px 36px -10px rgba(0,0,0,0.55),0 0 18px -8px ${card.btnGlow}`;
    el.innerHTML = `
      <img class="card-img" src="${IMGS[card.img]}" alt="${card.name}">
      <div class="card-overlay" style="background:${overlay}"></div>
      <div class="card-inner">
        <div class="card-spacer"></div>
        <div class="card-text">
          <div class="card-cat" style="color:${card.catCol}">${card.category}</div>
          <div class="card-name" style="color:${textColor}">${card.name}</div>
          <div class="card-divider" style="background:${card.catCol}"></div>
          <div class="card-short" style="color:${subColor}">${card.short}</div>
          <div class="card-full" id="full-${i}" style="color:${subColor};border-top-color:${card.catCol}22">${card.full}</div>
          <div class="card-brand" id="brand-${i}" style="background:${card.catCol}18;border-color:${card.catCol}44;color:${card.catCol}">${card.brand}</div>
        </div>
      </div>
      <div class="card-expand" id="hint-${i}" style="color:${isDark?'rgba(250,247,242,0.35)':'rgba(50,25,8,0.35)'}">▼ More details</div>
      <a class="book-btn" href="https://wa.me/919876543210?text=Book ${encodeURIComponent(card.name)}" target="_blank" onclick="event.stopPropagation()">Book Now →</a>
      <div class="story-label">${card.tagline}</div>
    `;

    let open = false;
    el.addEventListener('click', () => {
      open = !open;
      const full = document.getElementById('full-'+i);
      const brand = document.getElementById('brand-'+i);
      const hint = document.getElementById('hint-'+i);
      full.style.display = open ? 'block' : 'none';
      brand.style.display = open ? 'inline-block' : 'none';
      hint.textContent = open ? '▲ Less' : '▼ More details';
      el.style.boxShadow = open
        ? `0 28px 60px -10px rgba(0,0,0,0.70),0 0 40px -5px ${card.btnGlow}`
        : `0 12px 36px -10px rgba(0,0,0,0.55),0 0 18px -8px ${card.btnGlow}`;
    });

    container.appendChild(el);
  });
}

buildCards();
</script>
